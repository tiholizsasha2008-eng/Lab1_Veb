<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список бажань</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/style.css">
    <!-- Практична №10: Vue 3 (глобальна збірка, без Node.js); defer зберігає порядок: спочатку Vue, потім script.js -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>Список бажань</h1>
        <nav>
            <ul>
                <li><a href="#add-wish">Додати бажання</a></li>
                <li><a href="#wishlist">Мої бажання</a></li>
                <li><a href="#summary">Підсумок</a></li>
            </ul>
        </nav>
    </header>

    <div class="layout">
        <main>
            <section id="add-wish">
                <h2>Додати нове бажання</h2>
                <form action="#" method="post">
                    <div>
                        <label for="wish-title">Назва бажання:</label>
                        <input type="text" id="wish-title" name="title" placeholder="Наприклад, Навушники" required>
                    </div>

                    <div>
                        <label for="wish-price">Орієнтовна ціна (грн):</label>
                        <input type="number" id="wish-price" name="price" min="0" step="1" placeholder="2500" required>
                        <p class="field-error" id="price-error" aria-live="polite"></p>
                    </div>

                    <div>
                        <label for="wish-priority">Пріоритет:</label>
                        <select id="wish-priority" name="priority">
                            <option value="високий">Високий</option>
                            <option value="середній" selected>Середній</option>
                            <option value="низький">Низький</option>
                        </select>
                    </div>

                    <button type="submit">Додати до списку</button>
                </form>
            </section>

            <section id="wishlist">
                <h2>Список бажаних речей</h2>

                <!-- Практична №10: сюди Vue монтує список компонентів WishItem
                     (статичні картки-заглушки видалено, їх замінено компонентом) -->
                <div id="wishlist-app"></div>
            </section>

            <section id="server-wishes">
                <div class="section-head">
                    <h2>Бажання із сервера</h2>
                    <button type="button" id="refresh-btn">Оновити</button>
                </div>
                <p class="api-status" id="api-status" aria-live="polite" hidden>Завантаження…</p>
                <p class="api-error" id="api-error" role="alert" hidden></p>
                <div class="cards" id="server-cards"></div>
            </section>
        </main>

        <aside id="summary">
            <h2>Підсумкова вартість</h2>
            <p>Загальна кількість бажань: <strong>3</strong></p>
            <p class="summary-label">Загальна необхідна сума:</p>
            <p id="total-price">7&nbsp;900&nbsp;грн</p>
        </aside>
    </div>

    <footer>
        <p>&copy; 2026 Wishlist App. Виконав студент групи ІП-52 Тихоліз О.В.</p>
    </footer>
</body>
</html>
