<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список бажань</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>Список бажань</h1>
    <nav>
        <ul>
            <li><a href="#add-wish">Додати бажання</a></li>
            <li><a href="#wishlist">Мої бажання</a></li>
            <li><a href="#summary">Підсумок</a></li>
        </ul>
    </nav>
</header>

<main>
        <!-- Секція форми -->
        <section id="add-wish">
            <h2>Додати нове бажання</h2>
        </section>

        <!-- Секція списку бажань -->
        <section id="wishlist">
            <h2>Список бажаних речей</h2>
        </section>

        <!-- Секція підсумкової суми -->
        <section id="summary">
            <h2>Підсумкова вартість</h2>
            <p>Загальна кількість бажань: <strong>3</strong></p>
            <p>Загальна необхідна сума: <strong>7 900 грн</strong></p>
        </section>
    </main>
    <!-- Підвал (футер) сторінки -->

    <script src="js/app.js"></script>
</body>
</html>
